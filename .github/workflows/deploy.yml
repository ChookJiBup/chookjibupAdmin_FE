name: Deploy to EC2

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Deploy via SSM
        env:
          INSTANCE_ID: i-001443c95251eae57
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "cd /home/ec2-user/app/chookjibupAdmin_FE",
              "sudo -u ec2-user git fetch origin",
              "sudo -u ec2-user git reset --hard origin/main",
              "sudo -u ec2-user env HOME=/home/ec2-user pnpm install --frozen-lockfile",
              "sudo -u ec2-user env HOME=/home/ec2-user pnpm build",
              "systemctl restart chookjibup-admin-fe",
              "sleep 8",
              "systemctl is-active chookjibup-admin-fe"
            ]}' \
            --query 'Command.CommandId' --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="InProgress"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text)
            echo "Status: $STATUS"
            if [[ "$STATUS" != "InProgress" && "$STATUS" != "Pending" && "$STATUS" != "Delayed" ]]; then
              break
            fi
            sleep 10
          done

          echo "----- Command output -----"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text

          if [[ "$STATUS" != "Success" ]]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi
